name: Task
description: Maintenance, refactoring, docs, tooling or release work.
title: "chore: "
labels: ["type: chore", "status: needs triage"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this needs doing now.
    validations:
      required: true

  - type: textarea
    id: work
    attributes:
      label: What needs to be done
      placeholder: |
        - [ ] …
        - [ ] …
    validations:
      required: true

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The check that proves it is finished.
    validations:
      required: true

  - type: input
    id: related
    attributes:
      label: Related issues or pull requests
      placeholder: e.g. #40, #30
